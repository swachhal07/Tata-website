<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/assets/tata-hitachi-white.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Homepage defaults, so link-preview scrapers and any crawler that does
       not execute JavaScript still get something meaningful. Each one carries
       `data-seo`, which is how <Seo> claims ownership: on mount it clears
       every [data-seo] element and re-emits the tags for the current route,
       so these never end up duplicated. The <title> is deliberately untagged
       — document.title overwrites it in place. -->
  <title>Tata Hitachi Nepal — Excavators &amp; Backhoe Loaders | Dugar</title>
  <meta data-seo name="description"
    content="Authorised Tata Hitachi distributor in Nepal. Excavators, backhoe loaders, mining equipment, genuine parts and service across 10 branches nationwide." />
  <link data-seo rel="canonical" href="https://www.dugarearthmovers.com.np/" />
  <meta data-seo name="robots" content="index, follow, max-image-preview:large" />

  <meta data-seo property="og:type" content="website" />
  <meta data-seo property="og:site_name" content="Dugar Earthmovers" />
  <meta data-seo property="og:title" content="Tata Hitachi Nepal — Excavators &amp; Backhoe Loaders | Dugar" />
  <meta data-seo property="og:description"
    content="Authorised Tata Hitachi distributor in Nepal. Excavators, backhoe loaders, mining equipment, genuine parts and service across 10 branches nationwide." />
  <meta data-seo property="og:url" content="https://www.dugarearthmovers.com.np/" />
  <meta data-seo property="og:image" content="https://www.dugarearthmovers.com.np/og-default.jpg" />
  <meta data-seo property="og:locale" content="en_NP" />

  <meta data-seo name="twitter:card" content="summary_large_image" />
  <meta data-seo name="twitter:title" content="Tata Hitachi Nepal — Excavators &amp; Backhoe Loaders | Dugar" />
  <meta data-seo name="twitter:description"
    content="Authorised Tata Hitachi distributor in Nepal. Excavators, backhoe loaders, mining equipment, genuine parts and service across 10 branches nationwide." />
  <meta data-seo name="twitter:image" content="https://www.dugarearthmovers.com.np/og-default.jpg" />

  <!-- The prerender step injects a plain-HTML snapshot of each route into
       #root so crawlers that do not execute JavaScript have something to read.
       React clears it on mount, but until the bundle arrives it was the
       visible page - a wall of unstyled text flashing before the real site.
       Hide it whenever JavaScript is available: crawlers read raw HTML and are
       unaffected, and a visitor with JS never sees it. If React still has not
       mounted after four seconds the bundle is slow or broken, so reveal the
       snapshot again rather than leaving a blank page. -->
  <style>.js #prerender-snapshot { display: none }</style>
  <script>
    (function () {
      var root = document.documentElement
      root.classList.add('js')
      setTimeout(function () {
        if (document.getElementById('prerender-snapshot')) root.classList.remove('js')
      }, 4000)
    })()
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
